<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Admin Dashboard</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50 font-sans text-gray-900">

    <!-- Navbar -->
    <header class="bg-indigo-600 text-white shadow-md">
        <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-store"></i> E-Commerce Dashboard
            </h1>
            <span class="text-xs bg-indigo-500 py-1 px-3 rounded-full uppercase tracking-wider">FastAPI + SQLite</span>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 py-6">

        <!-- Tabs Navigation -->
        <div class="flex border-b border-gray-200 mb-6 gap-4">
            <button onclick="switchTab('students')" id="tab-students-btn" class="tab-btn pb-3 px-4 font-semibold border-b-2 border-indigo-600 text-indigo-600 flex items-center gap-2">
                <i class="fa-solid fa-users"></i> Students / Users
            </button>
            <button onclick="switchTab('products')" id="tab-products-btn" class="tab-btn pb-3 px-4 font-semibold border-b-2 border-transparent text-gray-500 hover:text-indigo-600 flex items-center gap-2">
                <i class="fa-solid fa-box-open"></i> Products
            </button>
            <button onclick="switchTab('orders')" id="tab-orders-btn" class="tab-btn pb-3 px-4 font-semibold border-b-2 border-transparent text-gray-500 hover:text-indigo-600 flex items-center gap-2">
                <i class="fa-solid fa-cart-shopping"></i> Orders
            </button>
        </div>

        <!-- ================= STUDENTS SECTION ================= -->
        <section id="students-section" class="space-y-6">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Create Student Form -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 h-fit">
                    <h2 class="text-lg font-bold mb-4 text-indigo-700 flex items-center gap-2">
                        <i class="fa-solid fa-user-plus"></i> Add New Student
                    </h2>
                    <form id="student-form" onsubmit="handleStudentSubmit(event)" class="space-y-4">
                        <input type="hidden" id="student-id">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Full Name</label>
                            <input type="text" id="student-name" required minlength="3" maxlength="16" class="mt-1 w-full p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Email Address</label>
                            <input type="email" id="student-email" required class="mt-1 w-full p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Phone Number</label>
                            <input type="text" id="student-phone" required class="mt-1 w-full p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">City</label>
                                <input type="text" id="student-city" required class="mt-1 w-full p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">State</label>
                                <input type="text" id="student-state" required class="mt-1 w-full p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Password</label>
                            <input type="password" id="student-password" value="Password@123" required class="mt-1 w-full p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                        <div class="flex gap-2">
                            <button type="submit" id="student-submit-btn" class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 font-medium transition">Save Student</button>
                            <button type="button" onclick="resetStudentForm()" class="hidden bg-gray-300 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-400 font-medium" id="student-cancel-btn">Cancel</button>
                        </div>
                    </form>
                </div>

                <!-- Student List Table -->
                <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-100 overflow-x-auto">
                    <h2 class="text-lg font-bold mb-4 text-indigo-700 flex items-center gap-2">
                        <i class="fa-solid fa-address-book"></i> Registered Students
                    </h2>
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-100 text-xs uppercase text-gray-600">
                                <th class="p-3">ID</th>
                                <th class="p-3">Name</th>
                                <th class="p-3">Email</th>
                                <th class="p-3">Phone</th>
                                <th class="p-3">Location</th>
                                <th class="p-3 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="students-table-body" class="divide-y divide-gray-200 text-sm">
                            <!-- Populated dynamically via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- ================= PRODUCTS SECTION ================= -->
        <section id="products-section" class="space-y-6 hidden">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Create Product Form -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 h-fit">
                    <h2 class="text-lg font-bold mb-4 text-indigo-700 flex items-center gap-2">
                        <i class="fa-solid fa-circle-plus"></i> Add New Product
                    </h2>
                    <form id="product-form" onsubmit="handleProductSubmit(event)" class="space-y-4">
                        <input type="hidden" id="product-id">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Product Title</label>
                            <input type="text" id="product-title" required minlength="3" maxlength="16" class="mt-1 w-full p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Category</label>
                            <input type="text" id="product-category" required minlength="3" maxlength="16" class="mt-1 w-full p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Price (₹)</label>
                                <input type="number" step="0.01" id="product-price" required min="1" class="mt-1 w-full p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700">Stock</label>
                                <input type="number" id="product-stock" required min="1" class="mt-1 w-full p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                            </div>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Brand</label>
                            <input type="text" id="product-brand" required class="mt-1 w-full p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                        <div class="flex gap-2">
                            <button type="submit" id="product-submit-btn" class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 font-medium transition">Save Product</button>
                            <button type="button" onclick="resetProductForm()" class="hidden bg-gray-300 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-400 font-medium" id="product-cancel-btn">Cancel</button>
                        </div>
                    </form>
                </div>

                <!-- Product List Table -->
                <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-100 overflow-x-auto">
                    <h2 class="text-lg font-bold mb-4 text-indigo-700 flex items-center gap-2">
                        <i class="fa-solid fa-boxes-stacked"></i> Available Store Products
                    </h2>
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-100 text-xs uppercase text-gray-600">
                                <th class="p-3">ID</th>
                                <th class="p-3">Title</th>
                                <th class="p-3">Category</th>
                                <th class="p-3">Price</th>
                                <th class="p-3">Stock</th>
                                <th class="p-3">Brand</th>
                                <th class="p-3 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="products-table-body" class="divide-y divide-gray-200 text-sm">
                            <!-- Populated dynamically via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- ================= ORDERS SECTION ================= -->
        <section id="orders-section" class="space-y-6 hidden">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Create Order Form -->
                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 h-fit">
                    <h2 class="text-lg font-bold mb-4 text-indigo-700 flex items-center gap-2">
                        <i class="fa-solid fa-cart-plus"></i> Place New Order
                    </h2>
                    <form id="order-form" onsubmit="handleOrderSubmit(event)" class="space-y-4">
                        <input type="hidden" id="order-id">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Select User / Student ID</label>
                            <select id="order-user-id" required class="mt-1 w-full p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                                <!-- Populated dynamically -->
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Select Product ID</label>
                            <select id="order-product-id" required class="mt-1 w-full p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                                <!-- Populated dynamically -->
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Quantity</label>
                            <input type="number" id="order-quantity" value="1" min="1" required class="mt-1 w-full p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">Payment Mode</label>
                            <select id="order-payment-mode" required class="mt-1 w-full p-2 border border-gray-300 rounded-lg focus:ring-indigo-500 focus:border-indigo-500">
                                <option value="UPI">UPI</option>
                                <option value="Credit Card">Credit Card</option>
                                <option value="Net Banking">Net Banking</option>
                                <option value="COD">COD</option>
                            </select>
                        </div>
                        <div class="flex gap-2">
                            <button type="submit" id="order-submit-btn" class="w-full bg-indigo-600 text-white py-2 rounded-lg hover:bg-indigo-700 font-medium transition">Place Order</button>
                            <button type="button" onclick="resetOrderForm()" class="hidden bg-gray-300 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-400 font-medium" id="order-cancel-btn">Cancel</button>
                        </div>
                    </form>
                </div>

                <!-- Orders List Table -->
                <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-100 overflow-x-auto">
                    <h2 class="text-lg font-bold mb-4 text-indigo-700 flex items-center gap-2">
                        <i class="fa-solid fa-list-check"></i> Orders History
                    </h2>
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-gray-100 text-xs uppercase text-gray-600">
                                <th class="p-3">Order ID</th>
                                <th class="p-3">User ID</th>
                                <th class="p-3">Product ID</th>
                                <th class="p-3">Qty</th>
                                <th class="p-3">Payment</th>
                                <th class="p-3">Status</th>
                                <th class="p-3 text-right">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="orders-table-body" class="divide-y divide-gray-200 text-sm">
                            <!-- Populated dynamically via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

    <!-- JavaScript Application Logic -->
    <script>
        const API_BASE = "http://127.0.0.1:8000"; // Adjust if your FastAPI runs on a different port

        // Tab Switcher
        function switchTab(tab) {
            ['students', 'products', 'orders'].forEach(t => {
                document.getElementById(`${t}-section`).classList.add('hidden');
                document.getElementById(`tab-${t}-btn`).classList.remove('border-indigo-600', 'text-indigo-600');
                document.getElementById(`tab-${t}-btn`).classList.add('border-transparent', 'text-gray-500');
            });
            document.getElementById(`${tab}-section`).classList.remove('hidden');
            document.getElementById(`tab-${tab}-btn`).classList.add('border-indigo-600', 'text-indigo-600');
            document.getElementById(`tab-${tab}-btn`).classList.remove('border-transparent', 'text-gray-500');
            
            if (tab === 'orders') {
                loadDropdownData();
            }
        }

        // ================= STUDENTS LOGIC =================
        async function fetchStudents() {
            try {
                const res = await fetch(`${API_BASE}/all_students`);
                const result = await res.json();
                const tbody = document.getElementById('students-table-body');
                tbody.innerHTML = '';
                
                if (result.data && result.data.length > 0) {
                    result.data.forEach(s => {
                        tbody.innerHTML += `
                            <tr class="hover:bg-gray-50">
                                <td class="p-3 font-medium">#${s.id}</td>
                                <td class="p-3">${s.name}</td>
                                <td class="p-3 text-gray-600">${s.email}</td>
                                <td class="p-3">${s.phone}</td>
                                <td class="p-3">${s.city}, ${s.state}</td>
                                <td class="p-3 text-right space-x-2">
                                    <button onclick='editStudent(${JSON.stringify(s)})' class="text-blue-600 hover:text-blue-800"><i class="fa-solid fa-pen-to-square"></i></button>
                                    <button onclick='deleteStudent(${s.id})' class="text-red-600 hover:text-red-800"><i class="fa-solid fa-trash"></i></button>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="6" class="p-4 text-center text-gray-500">No students found.</td></tr>`;
                }
            } catch (err) {
                console.error("Error fetching students:", err);
            }
        }

        async function handleStudentSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('student-id').value;
            const payload = {
                id: id ? parseInt(id) : Math.floor(Math.random() * 10000), // fallback random id if backend requires it in input model
                name: document.getElementById('student-name').value,
                email: document.getElementById('student-email').value,
                phone: document.getElementById('student-phone').value,
                city: document.getElementById('student-city').value,
                state: document.getElementById('student-state').value,
                password: document.getElementById('student-password').value
            };

            const url = id ? `${API_BASE}/update_student/${id}` : `${API_BASE}/create_student`;
            const method = id ? 'PUT' : 'POST';

            const res = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await res.json();
            if (result.status) {
                alert(result.message);
                resetStudentForm();
                fetchStudents();
            } else {
                alert("Operation failed: " + result.message);
            }
        }

        function editStudent(s) {
            document.getElementById('student-id').value = s.id;
            document.getElementById('student-name').value = s.name;
            document.getElementById('student-email').value = s.email;
            document.getElementById('student-phone').value = s.phone;
            document.getElementById('student-city').value = s.city;
            document.getElementById('student-state').value = s.state;
            document.getElementById('student-password').value = s.password;
            document.getElementById('student-submit-btn').innerText = "Update Student";
            document.getElementById('student-cancel-btn').classList.remove('hidden');
        }

        function resetStudentForm() {
            document.getElementById('student-form').reset();
            document.getElementById('student-id').value = '';
            document.getElementById('student-submit-btn').innerText = "Save Student";
            document.getElementById('student-cancel-btn').classList.add('hidden');
        }

        async function deleteStudent(id) {
            if (confirm("Are you sure you want to delete this student?")) {
                const res = await fetch(`${API_BASE}/delete_student/${id}`, { method: 'DELETE' });
                const result = await res.json();
                if (result.status) { fetchStudents(); } else { alert(result.message); }
            }
        }

        // ================= PRODUCTS LOGIC =================
        async function fetchProducts() {
            try {
                const res = await fetch(`${API_BASE}/all_products`);
                const result = await res.json();
                const tbody = document.getElementById('products-table-body');
                tbody.innerHTML = '';
                
                if (result.data && result.data.length > 0) {
                    result.data.forEach(p => {
                        tbody.innerHTML += `
                            <tr class="hover:bg-gray-50">
                                <td class="p-3 font-medium">#${p.id}</td>
                                <td class="p-3">${p.title}</td>
                                <td class="p-3"><span class="bg-gray-100 text-gray-700 px-2 py-1 rounded text-xs">${p.category}</span></td>
                                <td class="p-3 font-semibold text-indigo-600">₹${p.price.toFixed(2)}</td>
                                <td class="p-3"><span class="${p.stock > 0 ? 'text-green-600' : 'text-red-600'} font-medium">${p.stock} units</span></td>
                                <td class="p-3">${p.brand}</td>
                                <td class="p-3 text-right space-x-2">
                                    <button onclick='editProduct(${JSON.stringify(p)})' class="text-blue-600 hover:text-blue-800"><i class="fa-solid fa-pen-to-square"></i></button>
                                    <button onclick='deleteProduct(${p.id})' class="text-red-600 hover:text-red-800"><i class="fa-solid fa-trash"></i></button>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-gray-500">No products found.</td></tr>`;
                }
            } catch (err) {
                console.error("Error fetching products:", err);
            }
        }

        async function handleProductSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('product-id').value;
            const payload = {
                id: id ? parseInt(id) : Math.floor(Math.random() * 10000),
                title: document.getElementById('product-title').value,
                category: document.getElementById('product-category').value,
                price: parseFloat(document.getElementById('product-price').value),
                stock: parseInt(document.getElementById('product-stock').value),
                brand: document.getElementById('product-brand').value
            };

            const url = id ? `${API_BASE}/update_product/${id}` : `${API_BASE}/create_product`;
            const method = id ? 'PUT' : 'POST';

            const res = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await res.json();
            if (result.status) {
                alert(result.message);
                resetProductForm();
                fetchProducts();
            } else {
                alert("Operation failed: " + result.message);
            }
        }

        function editProduct(p) {
            document.getElementById('product-id').value = p.id;
            document.getElementById('product-title').value = p.title;
            document.getElementById('product-category').value = p.category;
            document.getElementById('product-price').value = p.price;
            document.getElementById('product-stock').value = p.stock;
            document.getElementById('product-brand').value = p.brand;
            document.getElementById('product-submit-btn').innerText = "Update Product";
            document.getElementById('product-cancel-btn').classList.remove('hidden');
        }

        function resetProductForm() {
            document.getElementById('product-form').reset();
            document.getElementById('product-id').value = '';
            document.getElementById('product-submit-btn').innerText = "Save Product";
            document.getElementById('product-cancel-btn').classList.add('hidden');
        }

        async function deleteProduct(id) {
            if (confirm("Are you sure you want to delete this product?")) {
                const res = await fetch(`${API_BASE}/delete_product/${id}`, { method: 'DELETE' });
                const result = await res.json();
                if (result.status) { fetchProducts(); } else { alert(result.message); }
            }
        }

        // ================= ORDERS LOGIC =================
        async function loadDropdownData() {
            try {
                // Load Students
                const sRes = await fetch(`${API_BASE}/all_students`);
                const sData = await sRes.json();
                const userSelect = document.getElementById('order-user-id');
                userSelect.innerHTML = '<option value="">Select Student</option>';
                if(sData.data) {
                    sData.data.forEach(s => {
                        userSelect.innerHTML += `<option value="${s.id}">${s.name} (ID: ${s.id})</option>`;
                    });
                }

                // Load Products
                const pRes = await fetch(`${API_BASE}/all_products`);
                const pData = await pRes.json();
                const prodSelect = document.getElementById('order-product-id');
                prodSelect.innerHTML = '<option value="">Select Product</option>';
                if(pData.data) {
                    pData.data.forEach(p => {
                        prodSelect.innerHTML += `<option value="${p.id}">${p.title} - ₹${p.price} (Stock: ${p.stock})</option>`;
                    });
                }
            } catch(err) {
                console.error("Error loading dropdown options:", err);
            }
        }

        async function fetchOrders() {
            try {
                const res = await fetch(`${API_BASE}/all_orders`);
                const result = await res.json();
                const tbody = document.getElementById('orders-table-body');
                tbody.innerHTML = '';
                
                if (result.data && result.data.length > 0) {
                    result.data.forEach(o => {
                        tbody.innerHTML += `
                            <tr class="hover:bg-gray-50">
                                <td class="p-3 font-medium">#${o.id}</td>
                                <td class="p-3">User #${o.user_id}</td>
                                <td class="p-3">Product #${o.product_id}</td>
                                <td class="p-3">${o.quantity}</td>
                                <td class="p-3"><span class="bg-indigo-50 text-indigo-700 px-2 py-1 rounded text-xs font-semibold">${o.payment_mode}</span></td>
                                <td class="p-3"><span class="text-green-600 font-medium">Active</span></td>
                                <td class="p-3 text-right space-x-2">
                                    <button onclick='deleteOrder(${o.id})' class="text-red-600 hover:text-red-800"><i class="fa-solid fa-trash"></i></button>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = `<tr><td colspan="7" class="p-4 text-center text-gray-500">No orders found.</td></tr>`;
                }
            } catch (err) {
                console.error("Error fetching orders:", err);
            }
        }

        async function handleOrderSubmit(e) {
            e.preventDefault();
            const id = document.getElementById('order-id').value;
            const payload = {
                id: id ? parseInt(id) : Math.floor(1000 + Math.random() * 9000),
                user_id: parseInt(document.getElementById('order-user-id').value),
                product_id: parseInt(document.getElementById('order-product-id').value),
                quantity: parseInt(document.getElementById('order-quantity').value),
                payment_mode: document.getElementById('order-payment-mode').value,
                status: true
            };

            const url = id ? `${API_BASE}/update_order/${id}` : `${API_BASE}/create_order`;
            const method = id ? 'PUT' : 'POST';

            const res = await fetch(url, {
                method: method,
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await res.json();
            if (result.status) {
                alert(result.message);
                resetOrderForm();
                fetchOrders();
                fetchProducts(); // Refresh products to show updated stock
            } else {
                alert("Order Failed: " + result.message);
            }
        }

        function resetOrderForm() {
            document.getElementById('order-form').reset();
            document.getElementById('order-id').value = '';
            document.getElementById('order-submit-btn').innerText = "Place Order";
            document.getElementById('order-cancel-btn').classList.add('hidden');
        }

        async function deleteOrder(id) {
            if (confirm("Are you sure you want to delete this order?")) {
                const res = await fetch(`${API_BASE}/delete_order/${id}`, { method: 'DELETE' });
                const result = await res.json();
                if (result.status) { fetchOrders(); } else { alert(result.message); }
            }
        }

        // Initialize App on Load
        window.onload = () => {
            fetchStudents();
            fetchProducts();
            fetchOrders();
        };
    </script>
</body>
</html>
